name: Deploy Laravel Application to Development Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Changes and Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.HOSTINGER_DEPLOY_PATH }}
        with:
          host: ${{ vars.HOSTINGER_HOST }}
          username: ${{ vars.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 65002
          envs: DEPLOY_PATH
          script: |
            set -e

            cd "$DEPLOY_PATH"

            shopt -s expand_aliases
            alias composer='/opt/alt/php84/usr/bin/php /usr/local/bin/composer2'
            alias php='/opt/alt/php84/usr/bin/php'

            git pull origin main

            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            # This workflow targets the demo staging server only.
            export APP_ENV=staging PORTAL_DEMO_SEED=true
            php artisan optimize:clear
            php artisan down
            # Also supports an empty staging database without resetting existing data.
            php artisan migrate --force --path=database/migrations/0001_01_01_000000_create_users_table.php --path=database/migrations/2026_10_27_000001_create_prototype_records.php
            # The legacy backfill needs its missing users BEFORE it can migrate.
            php artisan db:seed --class=StagingUsersSeeder --force
            php artisan migrate --force
            php artisan db:seed --force
            php artisan portal:verify
            php artisan optimize
            php artisan up
